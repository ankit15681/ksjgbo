name: Application checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements.txt
      - run: python -m pytest backend/tests -q
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - run: cd frontend && npx playwright install --with-deps chromium
      - name: Browser regression checks
        run: |
          uvicorn backend.main:app --host 127.0.0.1 --port 8000 > /tmp/winddesk-api.log 2>&1 &
          for i in $(seq 1 30); do curl --fail http://127.0.0.1:8000/api/health && break || sleep 1; done
          NODE_PATH=frontend/node_modules node scripts/browser-smoke.cjs
